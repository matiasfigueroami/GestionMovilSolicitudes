spring.application.name=usuarios-service
server.port=8081

# Perfil por defecto: H2 en archivo (no requiere instalar MySQL).
# Para usar MySQL: ejecutar con --spring.profiles.active=mysql (o la variable SPRING_PROFILES_ACTIVE=mysql)
spring.profiles.active=h2

# ---------- Base de datos (MySQL, por ejemplo la de XAMPP) ----------
# La base se crea sola si no existe. Usuario y clave se pueden cambiar con variables de entorno.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/gestion_usuarios?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Mensajes de error legibles en las respuestas
server.error.include-message=always

# Swagger UI: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
