# Perfil alternativo sin MySQL: base H2 guardada en un archivo local (carpeta ./data)
# Ejecutar con: mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:file:./data/gestion_solicitudes;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
