spring.application.name=solicitudes-service
server.port=8082

# ---------- Base de datos propia del microservicio (MySQL) ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/gestion_solicitudes?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Comunicación con el microservicio de usuarios ----------
servicios.usuarios.url=${USUARIOS_URL:http://localhost:8081}

server.error.include-message=always

# Swagger UI: http://localhost:8082/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
